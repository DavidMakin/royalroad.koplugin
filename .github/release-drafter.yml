name-template: "v$RESOLVED_VERSION 🌈"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Features"
    labels:
      - "feature"
      - "improvement"
  - title: "🐛 Bug Fixes"
    labels:
      - "fix"
      - "bugfix"
      - "hotfix"
  - title: "🧰 Maintenance"
    labels:
      - "build"
      - "poc"
      - "chore"
      - "ci"
      - "performance"
      - "refactor"
      - "revert"
      - "style"
  - title: "📚 Documentation"
    labels:
      - "docs"
  - title: "🔬 Tests"
    labels:
      - "test"
  - title: "📦 Packages"
    labels:
      - "packages"
      - "dependencies"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'
template: |
  ## What's changed 👀

  $CHANGES

