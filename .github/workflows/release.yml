name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Commit version bump and force-move tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull origin main
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^([[:space:]]*version[[:space:]]*=[[:space:]]*)\"[^\"]+\"/\1\"${VERSION}\"/" royalroad.koplugin/_meta.lua
          echo "Set version to ${VERSION}"
          grep version royalroad.koplugin/_meta.lua
          git add royalroad.koplugin/_meta.lua
          if ! git diff --staged --quiet; then
            git commit -m "chore: set version to ${GITHUB_REF_NAME}"
            git push origin main
            git tag -f "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}" --force
          fi

      - name: Create zip archive
        run: |
          mkdir staging
          cp -r royalroad.koplugin staging/royalroad.koplugin
          cd staging
          zip -r ../royalroad.koplugin.zip royalroad.koplugin \
            -x '**/.git/*' \
            -x '**/.github/*' \
            -x '**/*.zip'

      - name: Build Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@c9dc8369bccbc41e0ac887f8fd674f5925d315f7 # v5.4.1
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                { "title": "## 🚀 Features",    "labels": ["feat"] },
                { "title": "## 🐛 Bug Fixes",   "labels": ["fix"] },
                { "title": "## 🧰 Maintenance", "labels": ["refactor","chore","ci","build","docs","perf","style","test"] }
              ],
              "label_extractor": [
                {
                  "pattern": "^(feat|fix|refactor|chore|ci|build|docs|perf|style|test)(\\([^)]+\\))?(!)?:",
                  "on_property": "title",
                  "target": "$1"
                }
              ],
              "ignore_labels": ["chore", "ci", "build", "style"],
              "commit_template": "- #{{TITLE}}"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: royalroad.koplugin.zip
          draft: false
          prerelease: false
          body: ${{ steps.changelog.outputs.changelog }}
