name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Commit version bump and force-move tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull origin main
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^([[:space:]]*version[[:space:]]*=[[:space:]]*)\"[^\"]+\"/\1\"${VERSION}\"/" royalroad.koplugin/_meta.lua
          echo "Set version to ${VERSION}"
          grep version royalroad.koplugin/_meta.lua
          git add royalroad.koplugin/_meta.lua
          if ! git diff --staged --quiet; then
            git commit -m "chore: set version to ${GITHUB_REF_NAME}"
            git push origin main
            git tag -f "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}" --force
          fi

      - name: Create zip archive
        run: |
          mkdir staging
          cp -r royalroad.koplugin staging/royalroad.koplugin
          cd staging
          zip -r ../royalroad.koplugin.zip royalroad.koplugin \
            -x '**/.git/*' \
            -x '**/.github/*' \
            -x '**/*.zip'

      - name: Get previous tag
        id: prevtag
        run: |
          PREV=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Build Changelog
        id: changelog
        run: |
          PREV="${{ steps.prevtag.outputs.tag }}"
          RANGE="${PREV:+${PREV}..}${GITHUB_REF_NAME}"

          git log "${RANGE}" --pretty=format:"%s" --no-merges \
            | grep -v "^chore: set version" > /tmp/commits.txt || true

          FEATURES=$(grep "^feat" /tmp/commits.txt | sed "s/^/- /" || true)
          FIXES=$(grep "^fix" /tmp/commits.txt | sed "s/^/- /" || true)
          MAINTENANCE=$(grep -Ev "^feat|^fix|^chore|^ci:|^build:|^style:" /tmp/commits.txt | sed "s/^/- /" || true)

          {
            echo "changelog<<CHANGELOG_EOF"
            if [ -n "${FEATURES}" ]; then
              printf "## 🚀 Features\n%s\n\n" "${FEATURES}"
            fi
            if [ -n "${FIXES}" ]; then
              printf "## 🐛 Bug Fixes\n%s\n\n" "${FIXES}"
            fi
            if [ -n "${MAINTENANCE}" ]; then
              printf "## 🧰 Maintenance\n%s\n\n" "${MAINTENANCE}"
            fi
            echo "CHANGELOG_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="${{ steps.changelog.outputs.changelog }}"
          if gh release view "${GITHUB_REF_NAME}" &>/dev/null; then
            gh release edit "${GITHUB_REF_NAME}" \
              --draft=false \
              --notes "${NOTES}"
            gh release upload "${GITHUB_REF_NAME}" royalroad.koplugin.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "${NOTES}" \
              royalroad.koplugin.zip
          fi
