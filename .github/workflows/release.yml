name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Commit version bump and force-move tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull origin main
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^([[:space:]]*version[[:space:]]*=[[:space:]]*)\"[^\"]+\"/\1\"${VERSION}\"/" royalroad.koplugin/_meta.lua
          echo "Set version to ${VERSION}"
          grep version royalroad.koplugin/_meta.lua
          git add royalroad.koplugin/_meta.lua
          if ! git diff --staged --quiet; then
            git commit -m "chore: set version to ${GITHUB_REF_NAME}"
            git push origin main
            git tag -f "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}" --force
          fi

      - name: Create zip archive
        run: |
          mkdir staging
          cp -r royalroad.koplugin staging/royalroad.koplugin
          cd staging
          zip -r ../royalroad.koplugin.zip royalroad.koplugin \
            -x '**/.git/*' \
            -x '**/.github/*' \
            -x '**/*.zip'

      - name: Get previous tag
        id: prevtag
        run: |
          PREV=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Build Changelog
        id: changelog
        run: |
          PREV="${{ steps.prevtag.outputs.tag }}"
          if [ -z "${PREV}" ]; then
            RANGE="${GITHUB_REF_NAME}"
          else
            RANGE="${PREV}..${GITHUB_REF_NAME}"
          fi

          features=""
          fixes=""
          maintenance=""

          while IFS= read -r line; do
            case "${line}" in
              "feat"*) features="${features}- ${line}"$'\n' ;;
              "fix"*)  fixes="${fixes}- ${line}"$'\n' ;;
              "chore: set version"*) ;;
              *) maintenance="${maintenance}- ${line}"$'\n' ;;
            esac
          done < <(git log "${RANGE}" --pretty=format:"%s" | grep -v '^Merge ')

          body=""
          if [ -n "${features}" ]; then
            body="${body}## 🚀 Features"$'\n'"${features}"$'\n'
          fi
          if [ -n "${fixes}" ]; then
            body="${body}## 🐛 Bug Fixes"$'\n'"${fixes}"$'\n'
          fi
          if [ -n "${maintenance}" ]; then
            body="${body}## 🧰 Maintenance"$'\n'"${maintenance}"$'\n'
          fi

          {
            echo "changelog<<EOF"
            echo "${body}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: royalroad.koplugin.zip
          draft: false
          prerelease: false
          body: ${{ steps.changelog.outputs.changelog }}
