<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- New-chapters ribbon: blue diagonal band with a white plus (+), matching
     the "[+N new]" text badge in the downloads list. Mirrors the exclusion
     ribbon geometry (icons/excluded_ribbon.svg) so both badges share the same
     corner footprint, but sits on the opposite (bottom-right) corner.
     Rendered by KOReader's NanoSVG, so only primitives are allowed: the plus
     is two stroked lines, no <text>. Band is a 142x46 rect rotated 45deg
     about the 100x100 square's centre; the plus strokes (34..66, max
     perpendicular distance 19.5 incl. round caps) fit inside the band's
     half-thickness of 23. -->

